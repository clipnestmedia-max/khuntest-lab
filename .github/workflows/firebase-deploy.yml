name: Deploy KhunTest Lab to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firestore security rules
        # Must never block the Hosting deploy below: if the service account
        # lacks Firestore rules permission this step fails, but the site
        # (with the actual bug fix) still has to go live.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHUNTEST_LAB_E5966 }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx --yes firebase-tools@latest deploy --only firestore:rules --project khuntest-lab-e5966 --non-interactive
          rm -f /tmp/firebase-service-account.json

      - name: Set up Node for Cloud Functions
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test and deploy Cloud Functions (getSharedReport)
        # Same reasoning as the rules step above: a functions-deploy problem
        # (missing IAM role, failing test) must not take Hosting down with it.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHUNTEST_LAB_E5966 }}
        run: |
          cd functions
          npm ci
          npm test
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx --yes firebase-tools@latest deploy --only functions --project khuntest-lab-e5966 --non-interactive
          rm -f /tmp/firebase-service-account.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHUNTEST_LAB_E5966 }}
          channelId: live
          projectId: khuntest-lab-e5966
