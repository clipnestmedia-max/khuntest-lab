<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Dashboard - KHUNTEST LABS</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="seo.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f8fc;
      color: #0f172a;
    }

    .topbar {
      background: #062b5f;
      color: #fff;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
    }

    .logout-btn {
      border: none;
      background: #d60000;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: #fff;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 22px;
    }

    .welcome h1 {
      color: #062b5f;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card .num {
      font-size: 30px;
      font-weight: 900;
      color: #062b5f;
    }
    .action-card {
      text-decoration: none;
      color: inherit;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }
    .action-card strong {
      color: #062b5f;
      font-size: 18px;
      margin-bottom: 6px;
    }
    .action-card span {
      color: #64748b;
      font-size: 14px;
    }
    button.action-card {
      border: 0;
      cursor: pointer;
    }

    .section {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f1f5f9;
      color: #062b5f;
    }

    .btn {
      display: inline-block;
      background: #062b5f;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      border: 0;
      cursor: pointer;
    }
    .btn-red { background:#d60000; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    .profile-grid { display:grid; grid-template-columns:repeat(2,minmax(220px,1fr)); gap:12px; margin-top:14px; }
    .profile-grid .full { grid-column:1/-1; }
    input,select,textarea{width:100%;padding:10px;border:1px solid #d9e2ef;border-radius:8px;margin-top:6px}
    .msg{margin-top:10px;font-weight:800;color:#166534}

    .empty {
      padding: 20px;
      text-align: center;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 15px;
      }

      table {
        font-size: 12px;
      }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">KHUNTEST LABS - Patient Dashboard</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="welcome">
      <h1 id="welcomeName">Welcome Patient</h1>
      <p id="patientEmail">Loading...</p>
      <div class="toolbar">
        <a class="btn btn-red" href="booking.html">New Booking</a>
        <button class="btn" type="button" onclick="toggleProfile()">Edit Profile</button>
        <button class="btn" type="button" onclick="changePassword()">Change Password</button>
      </div>
      <form id="profileForm" class="profile-grid" style="display:none;">
        <label>Full Name<input name="name"></label>
        <label>Age<input name="age"></label>
        <label>Gender<select name="gender"><option></option><option>Male</option><option>Female</option><option>Other</option></select></label>
        <label>Mobile<input name="phone"></label>
        <label>WhatsApp<input name="whatsapp"></label>
        <label>Email<input name="email" readonly></label>
        <label class="full">Address<textarea name="address"></textarea></label>
        <label>City<input name="city"></label>
        <label>Pincode<input name="pincode"></label>
        <div class="full"><button class="btn btn-red" type="submit">Save Profile</button></div>
        <div id="profileMsg" class="msg full"></div>
      </form>
    </div>

    <div class="cards">
      <a class="card action-card" href="#bookingArea"><strong>My Reports</strong><span id="totalReports">0 ready reports</span></a>
      <a class="card action-card" href="#bookingArea"><strong>My Bookings</strong><span id="totalBookings">0 bookings</span></a>
      <a class="card action-card" href="booking.html"><strong>Book a Test</strong><span>Schedule a visit or home collection</span></a>
      <a class="card action-card" href="#bookingArea"><strong>Payment History</strong><span>See payment status with each booking</span></a>
      <button class="card action-card" type="button" onclick="toggleProfile()"><strong>My Profile</strong><span>Update contact details</span></button>
      <button class="card action-card" type="button" onclick="logout()"><strong>Logout</strong><span>End this session</span></button>
    </div>

    <div class="section">
      <h2>Your Bookings / Reports</h2>
      <div id="bookingArea" class="empty">Loading bookings...</div>
    </div>
  </div>

  <script type="module">
    import { createCustomerBillForBooking, getPatientBookings, getReportByBillNo, listenMyOnlineBookings, savePatientProfile } from "./firebase-service.js";
    import { clearPatientSession, logoutPatient, requestPatientPasswordReset, requirePatientAuth } from "./js/patient-auth.js";

    function safe(value) {
      return String(value ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
    }

    let currentAuthUser = null;
    let currentProfile = {};
    let onlineRows = [];
    const rupees = (value) => "₹" + Number(value || 0).toLocaleString("en-IN");

    window.logout = async function() {
      await logoutPatient();
      window.location.href = "patient-login.html";
    };

    async function protectPage() {
      try {
        const patient = await requirePatientAuth();
        currentAuthUser = { uid: patient.uid || patient.id, email: patient.email };
        currentProfile = patient;
        return patient;
      } catch (err) {
        clearPatientSession();
        window.location.replace("patient-login.html");
        return null;
      }
    }

    window.toggleProfile = function() {
      const form = document.getElementById("profileForm");
      form.style.display = form.style.display === "none" ? "grid" : "none";
    };

    window.changePassword = async function() {
      const email = currentProfile.email || currentAuthUser?.email;
      if (!email) return alert("Email not found.");
      await requestPatientPasswordReset(email);
      alert("Password reset email sent.");
    };

    function fillProfileForm(user) {
      const f = document.getElementById("profileForm");
      ["name","age","gender","phone","whatsapp","email","address","city","pincode"].forEach((key) => {
        if (f.elements[key]) f.elements[key].value = key === "name" ? normalizePatientName(user[key]) : (user[key] || "");
      });
    }

    const normalizePatientName = (value) => String(value || "").trim().replace(/\s+/g, " ").toUpperCase();
    const profileNameInput = document.querySelector('#profileForm [name="name"]');
    profileNameInput?.classList.add("patient-name-field");
    profileNameInput?.addEventListener("input", function() {
      const cursor = profileNameInput.selectionStart;
      profileNameInput.value = profileNameInput.value.toUpperCase();
      if (cursor !== null) profileNameInput.setSelectionRange(cursor, cursor);
    });
    profileNameInput?.addEventListener("blur", function() {
      profileNameInput.value = normalizePatientName(profileNameInput.value);
    });

    document.getElementById("profileForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.name = normalizePatientName(data.name);
      await savePatientProfile(currentAuthUser.uid, { ...data, role: "patient", isActive: true, uid: currentAuthUser.uid });
      localStorage.setItem("auth_user", JSON.stringify({ ...currentProfile, ...data }));
      currentProfile = { ...currentProfile, ...data };
      document.getElementById("profileMsg").textContent = "Profile updated.";
    });

    async function requestOnlineEdit(id) {
      alert("This booking is already confirmed. Please call or WhatsApp KHUNTEST LABS to request changes.");
    }

    function billButtonHtml(source, id) {
      return `<button class="btn" onclick="openPatientBill('${source}','${safe(id)}')">Print Bill</button>`;
    }

    window.openPatientBill = async function(source, id) {
      const row = source === "online"
        ? onlineRows.find((booking) => String(booking.id || booking.bookingId) === String(id))
        : window.patientBookingRows?.find((booking) => String(booking.id || booking.billNo || booking.bill_no) === String(id));
      if (!row) return alert("Booking not found.");
      const bill = await createCustomerBillForBooking(row, { reprint: true });
      window.open(`bill.html?bill=${encodeURIComponent(bill.billNo)}&token=${encodeURIComponent(bill.accessToken || "")}`, "_blank");
    };

    window.editOnlineBooking = function(id) {
      const row = onlineRows.find((b) => String(b.id || b.bookingId) === String(id));
      if (!row) return;
      const status = String(row.bookingStatus || row.status || "New");
      if (!["New", "Pending Confirmation"].includes(status)) return requestOnlineEdit(id);
      window.location.href = "booking.html";
    };

    async function loadPatientDashboard() {
      let user = null;
      try {
        document.getElementById("patientEmail").innerText = "Loading your account...";
        user = await protectPage();
        if (!user) return;
      } catch (err) {
        document.getElementById("patientEmail").innerText = "We could not load your account information.";
        document.getElementById("bookingArea").innerHTML = "<div class='empty'>We could not load your account information.<br><button class='btn' type='button' onclick='location.reload()'>Retry</button> <button class='btn btn-red' type='button' onclick='logout()'>Log out and sign in again</button></div>";
        return;
      }

      const firstName = normalizePatientName(user.name).split(" ")[0] || "Patient";
      document.getElementById("welcomeName").innerText = "Hello, " + firstName;

      document.getElementById("patientEmail").innerText =
        "Your reports and bookings are available below.";
      fillProfileForm(user);

      try {
        const patientBookings = await getPatientBookings(user.email, user.phone, user);
        const reportFlags = await Promise.all(patientBookings.map(async (b) => {
          const bill = b.billNo || b.bill_no || "";
          return bill ? Boolean(await getReportByBillNo(bill)) : false;
        }));

        if (currentAuthUser) {
          listenMyOnlineBookings(currentAuthUser.uid, (rows) => {
            onlineRows = rows;
            document.getElementById("totalBookings").innerText = `${patientBookings.length + onlineRows.length} bookings`;
            renderBookings(patientBookings, reportFlags);
          }, (err) => console.error(err));
        }
        document.getElementById("totalBookings").innerText = `${patientBookings.length} bookings`;
        document.getElementById("totalReports").innerText = `${reportFlags.filter(Boolean).length} ready reports`;

        if (!patientBookings.length && !onlineRows.length) {
          const area = document.getElementById("bookingArea");
          area.innerHTML = "<div class='empty'>No booking found for this account.</div>";
          return;
        }

        renderBookings(patientBookings, reportFlags);
      } catch (err) {
        console.error(err);
        document.getElementById("bookingArea").innerHTML =
          "<div class='empty'>We could not load your account information.<br><button class='btn' type='button' onclick='location.reload()'>Retry</button> <button class='btn btn-red' type='button' onclick='logout()'>Log out and sign in again</button></div>";
        document.getElementById("totalBookings").innerText = "Unable to load";
        document.getElementById("totalReports").innerText = "Unable to load";
      }
    }

    function renderBookings(patientBookings, reportFlags) {
        window.patientBookingRows = patientBookings;
        const area = document.getElementById("bookingArea");
        const onlineHtml = onlineRows.map((b) => `
          <tr>
            <td>${safe(b.bookingId || b.id || "-")}</td>
            <td>${safe(normalizePatientName(b.patientName || currentProfile.name || "-"))}</td>
            <td>${safe((b.tests || b.selectedTests || []).map(t => t.name || t.testName).join(", "))}</td>
            <td>₹${Number(b.totalAmount || 0).toFixed(2)}</td>
            <td>${safe(b.bookingStatus || b.status || "New")}<br><small>Payment: ${safe(b.paymentStatus || "Pending")}</small></td>
            <td><button class="btn" onclick="editOnlineBooking('${safe(b.id || b.bookingId)}')">Edit</button> ${billButtonHtml("online", b.id || b.bookingId)}</td>
          </tr>
        `).join("");
        area.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Bill No</th>
                <th>Patient</th>
                <th>Tests</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Report</th>
              </tr>
            </thead>
            <tbody>
              ${patientBookings.map((b, index) => {
                const bill = b.bill_no || b.billNo || "";
                const selectedTests = Array.isArray(b.selectedTests) && b.selectedTests.length ? b.selectedTests : (Array.isArray(b.tests) ? b.tests : []);
                const tests = selectedTests.length
                  ? selectedTests.map(t => t.name || t.test_name || t.testName).filter(Boolean).join(", ")
                  : (b.test || "-");
                return `
                <tr>
                  <td>${safe(bill || "-")}</td>
                  <td>${safe(normalizePatientName(b.patient_name || b.patientName || currentProfile.name || "-"))}</td>
                  <td>${safe(tests)}</td>
                  <td>₹${Number(b.totalAmount || b.gross_total || b.grossTotal || b.price || 0).toFixed(2)}</td>
                  <td>${safe(b.status || "Pending")}</td>
                  <td>
                    ${reportFlags[index]
                      ? `<a class="btn" href="report.html?bill=${encodeURIComponent(bill)}&from=patient">View Report</a>`
                      : "Not released"}
                    ${billButtonHtml("booking", b.id || bill)}
                  </td>
                </tr>
              `}).join("")}
              ${onlineHtml}
            </tbody>
          </table>
        `;
    }

    document.addEventListener("DOMContentLoaded", loadPatientDashboard);
  </script>

</body>
</html>
